name: Deploy Web

# Deploys the Vite app to GitHub Pages using the official GitHub Actions
# deployment pipeline (actions/deploy-pages).
#
# REQUIRED ONE-TIME REPO SETTING:
#   Settings → Pages → Source → "GitHub Actions"
#
# The base URL is derived directly from the repository name so the build
# is never broken by configure-pages returning an empty base_path on the
# first run of a newly-configured Pages environment.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      label:
        description: 'Deployment label (informational only)'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read
  pages:    write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# ── Jobs ──────────────────────────────────────────────────────────────────────

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: genesis-web/package-lock.json

      - name: Install dependencies
        working-directory: genesis-web
        run: npm ci

      - name: Run tests
        working-directory: genesis-web
        run: npm run test

      # configure-pages wires up the GitHub Pages environment and emits
      # base_path.  We also compute a hard-coded fallback from the repo name
      # so the build is never silently broken by an empty output on first run.
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Resolve base path
        id: base
        run: |
          PAGES_BASE="${{ steps.pages.outputs.base_path }}"
          REPO_BASE="/${{ github.event.repository.name }}"
          # Prefer the value from configure-pages; fall back to repo name.
          if [ -n "$PAGES_BASE" ]; then
            echo "path=${PAGES_BASE}" >> "$GITHUB_OUTPUT"
            echo "Using configure-pages base: ${PAGES_BASE}"
          else
            echo "path=${REPO_BASE}" >> "$GITHUB_OUTPUT"
            echo "configure-pages returned empty — using repo name: ${REPO_BASE}"
          fi

      - name: Build for GitHub Pages
        working-directory: genesis-web
        env:
          VITE_BASE: ${{ steps.base.outputs.path }}
        run: |
          echo "Building with base: ${VITE_BASE}/"
          npm run build -- --base "${VITE_BASE}/"

      - name: Verify build output
        run: |
          DIST=genesis-web/dist

          # index.html must exist
          [ -f "${DIST}/index.html" ] \
            || { echo "ERROR: ${DIST}/index.html missing"; exit 1; }

          # Built index.html must reference assets under the correct base,
          # not root-relative paths like /assets/ (sign of an empty base).
          BASE="${{ steps.base.outputs.path }}"
          if ! grep -q "\"${BASE}/" "${DIST}/index.html"; then
            echo "ERROR: index.html does not contain asset paths prefixed with ${BASE}/"
            echo "--- index.html snippet ---"
            head -20 "${DIST}/index.html"
            exit 1
          fi

          echo "✓ index.html exists and contains correct base-prefixed asset paths"
          ls -lh "${DIST}/"

      # upload-pages-artifact adds .nojekyll automatically so Jekyll does not
      # strip Vite's _assets/ directory (leading-underscore rule).
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: genesis-web/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Deployment summary
        run: |
          LABEL="${{ github.event.inputs.label || 'auto' }}"
          URL="${{ steps.deploy.outputs.page_url }}"
          echo "### Deployed to GitHub Pages"                   >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |"                           >> $GITHUB_STEP_SUMMARY
          echo "|---|---|"                                       >> $GITHUB_STEP_SUMMARY
          echo "| Label  | \`${LABEL}\` |"                      >> $GITHUB_STEP_SUMMARY
          echo "| URL    | ${URL} |"                            >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |"             >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |"        >> $GITHUB_STEP_SUMMARY
